# ==========================================================
# Build System
# ==========================================================
[build-system]
build-backend = "hatchling.build"
requires = [ "editables~=0.3", "hatch-fancy-pypi-readme>=25.1", "hatchling>=1.27" ]

# ==========================================================
# Project Metadata
# ==========================================================
[project]
name = "sgalchemy"
version = "0.1.0"
description = "SQLAlchemy-style ORM for Autodesk Flow Production Tracking"
keywords = [ "flow-production-tracking", "orm", "shotgrid", "shotgun", "sqlalchemy" ]
license = "MIT"
license-files = [ "LICENSE" ]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dynamic = [ "readme" ]
dependencies = []
optional-dependencies.api = [
  "sg-python-api>=0.1,<0.2",
]
optional-dependencies.async = [
  "sg-python-api[async]>=0.1,<0.2",
]
optional-dependencies.official = [
  "shotgun-api3>=3.10.2",
]
urls.Documentation = "https://github.com/dactylo/sgalchemy/tree/main/docs"
urls.Homepage = "https://github.com/dactylo/sgalchemy"
urls.Issues = "https://github.com/dactylo/sgalchemy/issues"
urls.Repository = "https://github.com/dactylo/sgalchemy"
scripts.sgalchemy = "sgalchemy._cli:main"

[dependency-groups]
dev = [
  "mdformat",
  "mdformat-config",
  "mdformat-frontmatter",
  "mdformat-gfm",
  "mdformat-pyproject",
  "mdformat-ruff",
  "mdformat-shfmt",
  "pyproject-fmt",
  "ruff",
  { include-group = "test" },
]
test = [
  "pyright",
  "pytest",
  "pytest-xdist>=3.2",
]

[tool.hatch]
metadata.hooks.fancy-pypi-readme.content-type = "text/markdown"
metadata.hooks.fancy-pypi-readme.fragments = [ { path = "README.md" } ]
build.targets.wheel.packages = [ "src/sgalchemy" ]
build.targets.sdist.include = [ "/README.md", "/src/sgalchemy" ]

# Keep checkout links relative; package links target this release.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(!\[[^\]\n]*\]\()(?![A-Za-z][A-Za-z0-9+.-]*:|[/#])(?:\./)?([^\s)]+)(\))'
replacement = '\1https://raw.githubusercontent.com/dactylo/sgalchemy/v$HFPR_VERSION/\2\3'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?<!!)(\[[^\]\n]+\]\()(?![A-Za-z][A-Za-z0-9+.-]*:|[/#])(?:\./)?([^\s)]+)(\))'
replacement = '\1https://github.com/dactylo/sgalchemy/blob/v$HFPR_VERSION/\2\3'

[tool.uv]
# CI supplies the native Taplo CLI; its Python package lacks Linux/Windows ARM wheels.
exclude-dependencies = [
  { package = { name = "mdformat-config", version = "0.2.1" }, dependencies = [ "taplo" ] },
]

# ==========================================================
# Ruff Configuration
# ==========================================================
[tool.ruff]
target-version = "py311"
line-length = 99
format.quote-style = "single"
format.exclude = [ "*.md" ]
lint.select = [ "ALL" ]
lint.ignore = [
  "COM812", # Conflicts with the Ruff formatter
  "CPY001", # Copyright notices are not required
  "EM101",  # Exception must not use string literal
  "EM102",  # Exception must not use f-string literal
  "FBT001", # Boolean positional arg in function definition
  "FBT002", # Boolean default value in function definition
  "Q000",   # Conflicts with the Ruff formatter
  "Q003",   # Conflicts with the Ruff formatter
  "T201",   # print() found
  "TRY003", # Avoid specifying long messages outside exception class
]
lint.per-file-ignores."src/sgalchemy/_core/_engine.py" = [ "SLF001" ]
lint.per-file-ignores."src/sgalchemy/_orm/_async_session.py" = [ "SLF001" ]
lint.per-file-ignores."src/sgalchemy/_orm/_uow.py" = [ "SLF001" ]
lint.per-file-ignores."tests/**/*.py" = [
  "D",       # No docstrings required in tests
  "INP001",  # pytest rootdir-style tests directory has no __init__.py by design
  "PLR2004", # Allow magic values in tests
  "S101",    # Allow asserts in tests
  "S603",    # Allow subprocess calls in tests
  "S607",    # Allow partial executable paths in tests
  "SLF001",  # Tests intentionally inspect and patch private state
]
lint.isort.known-first-party = [ "sgalchemy" ]
lint.pydocstyle.convention = "google"

[tool.pyproject-fmt]
max_supported_python = "3.15"

# ==========================================================
# Pyright Configuration
# ==========================================================
[tool.pyright]
pythonVersion = "3.11"  # Keep in sync with tool.ruff.target-version
typeCheckingMode = "strict"
extraPaths = [ ".", "src" ]
executionEnvironments = [
  { root = "tests", reportPrivateUsage = "none" },
  { root = "." },
]

# ==========================================================
# Pytest Configuration
# ==========================================================
[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.pythonpath = [ "src" ]
ini_options.addopts = [ "-q", "--strict-markers", "--tb=short" ]
ini_options.markers = [
  "live: requires explicit Flow Production Tracking test-site configuration",
  "mockgun_gap: exercises behavior Mockgun cannot emulate; skipped against the Mockgun backend",
  "native_async: exercises native async provider behavior",
  "provider_contract: exercises the selected real provider without credentials",
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
ini_options.faulthandler_timeout = 300

[tool.defsort]
method-bodies = "across-categories"

# ==========================================================
# Mdformat Configuration (Requires mdformat-pyproject)
# ==========================================================
[tool.mdformat]
wrap = 99  # Keep in sync with tool.ruff.line-length
number = true
